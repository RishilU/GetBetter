<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GetBetter — Shared Goal</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #faf8f5;
        font-family: 'Inter', -apple-system, sans-serif;
        color: #2b2621;
        padding: 20px;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: #fff;
        border: 1px solid #e6e1d7;
        border-radius: 16px;
        padding: 28px;
      }
      .area {
        font-size: 12px;
        font-weight: 600;
        border-radius: 99px;
        padding: 3px 10px;
        display: inline-block;
        margin-bottom: 10px;
      }
      h1 {
        font-family: 'Fraunces', Georgia, serif;
        font-weight: 600;
        font-size: 22px;
        margin: 0 0 6px;
      }
      p.desc {
        color: #6b6258;
        font-size: 13px;
        line-height: 1.5;
        margin: 0 0 20px;
      }
      .stat-row {
        display: flex;
        gap: 20px;
        margin-bottom: 18px;
      }
      .stat { flex: 1; }
      .stat .label {
        font-size: 10.5px;
        color: #a89e8f;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
      }
      .stat .value {
        font-family: 'Fraunces', Georgia, serif;
        font-size: 24px;
        font-weight: 600;
      }
      .bar-track {
        background: #ede9e0;
        border-radius: 99px;
        height: 8px;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        border-radius: 99px;
      }
      .footer {
        margin-top: 20px;
        font-size: 11px;
        color: #a89e8f;
        text-align: center;
      }
      .error {
        text-align: center;
        color: #6b6258;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="root" class="card"><div class="error">Loading...</div></div>
    <script>
      const token = new URLSearchParams(window.location.search).get('token');
      const root = document.getElementById('root');

      function escapeHtml(s) {
        const div = document.createElement('div');
        div.textContent = s || '';
        return div.innerHTML;
      }

      async function load() {
        if (!token) {
          root.innerHTML = '<div class="error">Missing share link.</div>';
          return;
        }
        try {
          const res = await fetch('/api/share?token=' + encodeURIComponent(token));
          if (!res.ok) {
            root.innerHTML = '<div class="error">This link is invalid or has been revoked.</div>';
            return;
          }
          const d = await res.json();
          const habitPct = d.habitTotal > 0 ? Math.round((d.habitDone / d.habitTotal) * 100) : 0;
          const stagePct = d.stagesTotal > 0 ? Math.round((d.stagesDone / d.stagesTotal) * 100) : 0;
          root.innerHTML = `
            <span class="area" style="color:${d.areaColor};background:${d.areaColor}22">${escapeHtml(d.areaIcon)} ${escapeHtml(d.areaName)}</span>
            <h1>${escapeHtml(d.goalName)}</h1>
            <p class="desc">${escapeHtml(d.description)}</p>
            <div class="stat-row">
              <div class="stat"><div class="label">Today</div><div class="value">${habitPct}%</div></div>
              <div class="stat"><div class="label">Roadmap</div><div class="value">${d.stagesDone}/${d.stagesTotal}</div></div>
              <div class="stat"><div class="label">Streak</div><div class="value">🔥 ${d.streak}d</div></div>
            </div>
            <div class="bar-track"><div class="bar-fill" style="width:${stagePct}%;background:${d.areaColor}"></div></div>
            <div class="footer">Shared read-only progress from GetBetter</div>
          `;
        } catch {
          root.innerHTML = '<div class="error">Something went wrong loading this.</div>';
        }
      }

      load();
    </script>
  </body>
</html>
